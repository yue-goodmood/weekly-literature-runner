name: Offline tests
on:
  pull_request:
    paths:
      - 'weekly-literature/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_export.py
      - run: PYTHONPATH=weekly-literature/src python -m unittest discover -s weekly-literature/tests -v

